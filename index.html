<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura - Camera Test</title>
  </head>
  <body style="font-family: sans-serif; padding: 20px;">
    <h1>Aura Camera Test</h1>
    <p>Tap the button below — camera should open on iPhone.</p>

    <input 
      type="file" 
      accept="image/*" 
      capture="environment" 
      id="cameraInput"
      style="display: block; margin: 20px 0; padding: 10px; font-size: 16px; border: 2px solid #6C3FC5; border-radius: 8px;"
    />

    <div id="preview" style="margin-top: 20px;"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
