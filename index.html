<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura - AI Tutor</title>
  <style>
    html { background-color: #fff0f5; }
    html[data-theme="dark"] { background-color: #0c0d12; }
  </style>
</head>
<body>
  
  <div class="fab-container">
    <button id="home-btn" class="fab-btn" title="Back to Home">🏠︎</button>
    <button id="theme-btn" class="fab-btn" title="Toggle Theme">☽</button>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  
  <script>
    const themeBtn = document.getElementById('theme-btn');
    const currentTheme = localStorage.getItem('aura-theme');
    
    if (currentTheme === 'dark' || (!currentTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.innerText = '✴';
    }
    
    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('aura-theme', 'light');
        themeBtn.innerText = '☽';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('aura-theme', 'dark');
        themeBtn.innerText = '✴';
      }
    });

    document.getElementById('home-btn').addEventListener('click', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
